    <style>
        /* 預設：護眼模式 (舒適暖黃) */
        :root {
            --primary-color: #D4B853; 
            --success-color: #A38C3B;  
            --bg-color: #FDFCF7;      
            --dark-gray: #B5AD98;      
            --card-bg: #FFFFFF;        
            --error-red: #E08A8A;      
            --text-main: #5C5749;      
            --border-color: #EFECE1;
            --selected-bg: #FDF9EC; 
        }

        /* 一般模式 (明亮黃) */
        body.normal-mode {
            --primary-color: #FFD13B; 
            --success-color: #D1A724;
            --bg-color: #FFFEFA; 
            --dark-gray: #A8A185;
            --card-bg: #ffffff;
            --error-red: #FF7A7A;      
            --text-main: #4A463B;
            --border-color: #FFF6D9;
            --selected-bg: #FFFBF0; 
        }

        /* 基礎設定 */
        * { -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-color); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
            min-height: 100vh;
            color: var(--text-main);
            transition: background-color 0.3s ease; 
        }

        .container { 
            width: 100%;
            max-width: 600px; 
            background: var(--card-bg); 
            margin: 40px 10px; 
            padding: 30px 25px; 
            border-radius: 20px; 
            box-shadow: 0 8px 30px rgba(212,184,83,0.15);
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease;
        }

        @media (max-width: 480px) {
            .container { 
                margin: 0;
                border-radius: 0; 
                min-height: 100vh; 
                padding: 6vh 20px 20px 20px; 
                box-shadow: none;
            }
        }

        .hidden { display: none !important; }

        /* 標題設計 */
        .main-title {
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.2;
        }
        .main-title .highlight {
            font-size: 32px;
            font-weight: 900;
            color: var(--primary-color);
            display: block;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .main-title .sub {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
        }
        .tripod-icon {
            display: inline-block;
            vertical-align: middle;
            margin-left: 5px;
            width: 24px;
            height: 24px;
            opacity: 0.8;
        }

        /* 圖片樣式 */
        .q-image-container {
            text-align: center;
            margin-bottom: 20px;
            background: #fff;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .q-image-container img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
        }

        /* 內容樣式 */
        .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .progress-bar { font-size: 14px; color: var(--success-color); font-weight: 700; letter-spacing: 0.5px; }
        .badge-type { background: var(--text-main); color: var(--card-bg); font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: bold; }
        .question-text { font-size: 19px; font-weight: 600; margin-bottom: 25px; line-height: 1.5; color: var(--text-main); }
        
        /* 選項樣式 */
        .option { 
            display: block;
            width: 100%; padding: 16px; margin-bottom: 12px; 
            border: 2px solid var(--border-color); border-radius: 12px; text-align: left; 
            background: var(--card-bg); font-size: 16px; cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
        }
        @media (hover: hover) { .option:hover { border-color: var(--primary-color); background: var(--bg-color); } }

        /* 複選選取中狀態 */
        .option.selected { border-color: var(--primary-color); background: var(--selected-bg); font-weight: 600; }
        
        /* 對錯判定狀態 */
        .option.correct { border-color: var(--primary-color); background: var(--selected-bg); color: var(--success-color); font-weight: bold; }
        .option.wrong { border-color: var(--error-red); color: var(--error-red); background: #FFF5F5; }
        .option.missed { border-color: var(--primary-color); color: var(--success-color); background: transparent; font-weight: bold; }

        /* 按鈕系統 */
        .nav-group { display: flex; gap: 12px; margin-top: 20px; }
        .big-btn { 
            flex: 1;
            padding: 18px; font-size: 18px; font-weight: bold; border: none; 
            border-radius: 15px; cursor: pointer; transition: transform 0.1s, opacity 0.2s; color: white;
            display: flex; align-items: center; justify-content: center; width: 100%;
        }
        .big-btn:active { transform: scale(0.98); opacity: 0.9; }

        .start-btn { background: var(--primary-color); margin-bottom: 15px; color: var(--text-main); }
        .bank-btn { background: var(--dark-gray); } 
        
        .theme-btn { 
            background: transparent;
            border: 2px solid var(--primary-color); 
            color: var(--text-main); 
            padding: 10px 22px; 
            font-size: 14px; 
            font-weight: bold;
            border-radius: 30px;
            margin-top: 25px; 
            cursor: pointer;
            transition: all 0.2s;
        }
        
        #submit-btn { background: var(--primary-color); margin-top: 25px; color: var(--text-main); }
        #next-btn { background: var(--success-color); margin-top: 25px; }
        #bank-prev { background: var(--dark-gray); }
        #bank-next { background: var(--success-color); }
        
        .back-home { 
            width: 100%;
            padding: 14px; margin-top: 25px; border-radius: 10px; 
            border: 1px solid var(--dark-gray); background: transparent; color: var(--text-main); 
            cursor: pointer; font-size: 15px; font-weight: bold;
        }

        /* 最小字備註說明 */
        .legend-text {
            font-size: 11px;
            color: var(--dark-gray);
            text-align: center;
            margin-top: 15px;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }
    </style>
</head>

            <div id="q-options"></div>

        <button id="submit-btn" class="big-btn hidden" onclick="submitAnswer()">確認送出</button>
        <button id="next-btn" class="big-btn hidden" onclick="loadNextQuestion()">下一題</button>
        
        <div id="quiz-legend" class="legend-text hidden">

            <div style="font-size: 60px;">🎉</div>

            <button class="big-btn start-btn" style="width:100%" onclick="initQuiz()">再測一次</button>
            <button class="back-home" onclick="goHome()">回首頁</button>
        </div>
    </div>

    <div id="bank-category-screen" class="hidden">
        <h2 style="text-align:center; margin-bottom: 25px; color: var(--text-main);">選擇章節</h2>
        <div id="category-list" style="display: flex; flex-direction: column; gap: 10px;"></div>

    </div>

        <div id="bank-content"></div>
        <div class="nav-group">
            <button id="bank-prev" class="big-btn" onclick="moveBank(-1)">上一題</button>
            <button id="bank-next" class="big-btn" onclick="moveBank(1)">下一題</button>
        </div>

</div>

    let currentQuizPool = [];
    let currentIdx = 0;
    let userScore = 0;        
    let maxPossibleScore = 0; 
    let correctSingle = 0;    
    let correctMulti = 0;     
    let totalSingleSelected = 0; 
    let totalMultiSelected = 0;  

    let selectedOptions = []; 

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    // --- 主題切換功能 ---
    function toggleTheme() {
        const body = document.body;
        body.classList.toggle('normal-mode');
        const isNormal = body.classList.contains('normal-mode');
        localStorage.setItem('theme', isNormal ? 'normal' : 'eye-care');
        updateThemeBtn(isNormal);
    }

    function updateThemeBtn(isNormal) {
        const btn = document.getElementById('theme-btn');
        btn.innerHTML = isNormal ? "💡 切換為護眼模式" : "☀️ 切換為一般模式";
    }

    window.onload = () => {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'normal') {
            document.body.classList.add('normal-mode');
            updateThemeBtn(true);
        } else {
            updateThemeBtn(false);
        }
    };

    function goHome() {
        document.getElementById('home-screen').classList.remove('hidden');
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('bank-category-screen').classList.add('hidden');
        document.getElementById('bank-view-screen').classList.add('hidden');
    }

    // --- 混合測驗抽題與排版邏輯 ---
    function initQuiz() {
        if (allQuestions.length === 0) return alert("題庫暫無資料");
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        
        // 顯示測驗內容與備註
        document.getElementById('quiz-content').classList.remove('hidden');
        document.getElementById('quiz-legend').classList.remove('hidden'); 
        document.getElementById('quiz-screen').classList.remove('hidden');
        
        const singlePool = allQuestions.filter(q => !Array.isArray(q.answer));
        const multiPool = allQuestions.filter(q => Array.isArray(q.answer));

        const selectedSingle = shuffle([...singlePool]).slice(0, 60);
        const selectedMulti = shuffle([...multiPool]).slice(0, 20);

        currentQuizPool = [...selectedSingle, ...selectedMulti];
        
        currentIdx = 0;
        userScore = 0;
        correctSingle = 0;
        correctMulti = 0;
        totalSingleSelected = selectedSingle.length;
        totalMultiSelected = selectedMulti.length;
        maxPossibleScore = (totalSingleSelected * 1) + (totalMultiSelected * 2);

        loadQuizQuestion();
    }

    function loadQuizQuestion() {
        const q = currentQuizPool[currentIdx];
        const isMultiple = Array.isArray(q.answer);
        
        document.getElementById('quiz-progress').innerText = `第 ${currentIdx + 1} 題 / 共 ${currentQuizPool.length} 題`;
        document.getElementById('question-type-badge').innerText = isMultiple ? "複選題 (2分)" : "單選題 (1分)";
        document.getElementById('q-text').innerText = q.question;
        
        document.getElementById('next-btn').classList.add('hidden');
        if (isMultiple) {
            document.getElementById('submit-btn').classList.remove('hidden');
        } else {
            document.getElementById('submit-btn').classList.add('hidden');
        }
        
        const imgArea = document.getElementById('q-image-area');
        const imgTag = document.getElementById('q-image-src');
        if (q.image) {
            imgTag.src = q.image;
            imgArea.classList.remove('hidden');
        } else {
            imgArea.classList.add('hidden');
        }

        const optionsDiv = document.getElementById('q-options');
        optionsDiv.innerHTML = '';
        selectedOptions = [];

        const optionObjects = q.options.map((opt, i) => ({
            text: opt,
            originalIndex: i + 1
        }));
        shuffle(optionObjects);

        optionObjects.forEach((optObj, localIdx) => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerText = optObj.text;
            btn.dataset.originalIndex = optObj.originalIndex;

            btn.onclick = () => {
                if (!isMultiple) {
                    const allBtns = optionsDiv.querySelectorAll('.option');
                    allBtns.forEach(b => b.onclick = null);
                    
                    if (optObj.originalIndex === q.answer) {
                        // 單選答對
                        btn.classList.add('correct');
                        btn.innerText += " ✅";
                        userScore += 1;
                        correctSingle++;
                    } else {
                        // 單選答錯
                        btn.classList.add('wrong');
                        btn.innerText += " ❌";
                        // 標示出原本正確的答案是哪一個
                        optionObjects.forEach((item, idx) => {
                            if (item.originalIndex === q.answer) {
                                allBtns[idx].classList.add('missed');
                                allBtns[idx].innerText += " ⭕";
                            }
                        });
                    }
                    document.getElementById('next-btn').classList.remove('hidden');
                } else {
                    // 複選選取切換
                    if (btn.classList.contains('selected')) {
                        btn.classList.remove('selected');
                        selectedOptions = selectedOptions.filter(idx => idx !== localIdx);
                    } else {
                        btn.classList.add('selected');
                        selectedOptions.push(localIdx);
                    }
                }
            };
            optionsDiv.appendChild(btn);
        });
    }

    function submitAnswer() {
        if (selectedOptions.length === 0) {
            alert("請至少選擇一個選項！");
            return;
        }

        const q = currentQuizPool[currentIdx];
        const optionsDiv = document.getElementById('q-options');
        const allBtns = optionsDiv.querySelectorAll('.option');
        
        // 鎖定按鈕，防止重複點擊
        allBtns.forEach(b => b.onclick = null); 
        document.getElementById('submit-btn').classList.add('hidden');
        document.getElementById('next-btn').classList.remove('hidden');

        // 收集使用者的答案
        let userAnswers = [];
        allBtns.forEach(btn => {
            if (btn.classList.contains('selected')) {
                userAnswers.push(parseInt(btn.dataset.originalIndex));
            }
        });

        // 陣列排序後比對是否完全正確
        userAnswers.sort((a, b) => a - b);
        const correctAnswers = [...q.answer].sort((a, b) => a - b);
        const isCorrect = JSON.stringify(userAnswers) === JSON.stringify(correctAnswers);

        if (isCorrect) {
            userScore += 2;
            correctMulti++;
        }

        // 重新渲染每一個選項的對錯狀態
        allBtns.forEach(btn => {
            const origIdx = parseInt(btn.dataset.originalIndex);
            const isTargetAns = correctAnswers.includes(origIdx); 
            const userChecked = userAnswers.includes(origIdx);    

            // 清除預設的選取底色
            btn.classList.remove('selected');

            if (isTargetAns && userChecked) {
                // 正確且有選
                btn.classList.add('correct');
                btn.innerText += " ✅";
            } else if (isTargetAns && !userChecked) {
                // 正確但漏選
                btn.classList.add('missed');
                btn.innerText += " ⭕";
            } else if (!isTargetAns && userChecked) {
                // 錯誤但多選了
                btn.classList.add('wrong');
                btn.innerText += " ❌";
            }
        });
    }

    function loadNextQuestion() {
        currentIdx++;
        if (currentIdx < currentQuizPool.length) {
            loadQuizQuestion();
        } else {
            // 隱藏測驗內容與備註，顯示結果
            document.getElementById('quiz-content').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('quiz-legend').classList.add('hidden'); 
            document.getElementById('result-screen').classList.remove('hidden');
            
            const finalScore = Math.round((userScore / maxPossibleScore) * 100);
            document.getElementById('score-text').innerText = `${finalScore} 分`;
            document.getElementById('score-detail').innerText = `單選答對: ${correctSingle}/${totalSingleSelected} 題 | 複選答對: ${correctMulti}/${totalMultiSelected} 題`;
        }
    }

    // --- 題庫瀏覽模式 ---
    let bankPool = [];
    let bankIdx = 0;

    function showBankCategories() {
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('bank-category-screen').classList.remove('hidden');
        document.getElementById('bank-view-screen').classList.add('hidden');
        
        const categories = [...new Set(allQuestions.map(q => q.category))];
        const listDiv = document.getElementById('category-list');
        listDiv.innerHTML = '';
        
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.style.textAlign = 'center';
            btn.style.borderColor = 'var(--primary-color)';
            btn.style.color = 'var(--success-color)';
            btn.style.fontWeight = 'bold';
            btn.innerText = cat;
            btn.onclick = () => startBankView(cat);
            listDiv.appendChild(btn);
        });
    }

    function startBankView(cat) {
        bankPool = allQuestions.filter(q => q.category === cat);
        bankIdx = 0;
        document.getElementById('bank-category-screen').classList.add('hidden');
        document.getElementById('bank-view-screen').classList.remove('hidden');
        renderBankItem();
    }

    function renderBankItem() {
        const q = bankPool[bankIdx];
        const isMultiple = Array.isArray(q.answer);
        
        document.getElementById('bank-progress').innerText = `${q.category} - ${isMultiple ? "複選(2分)" : "單選(1分)"} (${bankIdx + 1}/${bankPool.length})`;
        const content = document.getElementById('bank-content');
        
        let imgHTML = '';
        if (q.image) {
            imgHTML = `<div class="q-image-container"><img src="${q.image}"></div>`;
        }
        
        content.innerHTML = `${imgHTML}<div class="question-text">${q.question}</div>`;
        
        q.options.forEach((optText, i) => {
            const isAns = isMultiple ? q.answer.includes(i + 1) : (i + 1 === q.answer);
            content.innerHTML += `<div class="option ${isAns ? 'correct' : ''}">${optText} ${isAns ? '✅' : ''}</div>`;
        });
    }

    function moveBank(step) {
        bankIdx += step;
        if (bankIdx < 0) bankIdx = 0;
        else if (bankIdx >= bankPool.length) bankIdx = bankPool.length - 1;
        renderBankItem();
    }
